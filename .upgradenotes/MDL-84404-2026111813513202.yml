issueNumber: MDL-84404
notes:
  core_question:
    - message: >-
        `\core_question\local\bank\filter_condition_manager::get_condition_classes()`
        has been deprecated, because it cannot describe conditions that provide
        a different key for each instance, such as custom field conditions. Use
        `\core_question\local\bank\filter_condition_manager::get_conditions()`,
        which returns a condition instance for each key, and call the instance
        methods `find_filter()` and `build_query()` instead of static methods on
        the condition class.
      type: deprecated
